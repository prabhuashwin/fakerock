name: docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Tag must match package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          ver=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' mock_bedrock/__init__.py)
          echo "tag=${GITHUB_REF_NAME#v} package=$ver"
          test -n "$ver" && test "${GITHUB_REF_NAME#v}" = "$ver"
      - name: Build (amd64, local)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: fakerock:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          docker run --rm fakerock:ci --version | grep '^mock_bedrock '
          docker run -d --name fr -p 127.0.0.1:52999:52999 fakerock:ci
          ok=0
          for i in $(seq 1 30); do
            s=$(docker inspect -f '{{.State.Health.Status}}' fr)
            echo "health: $s"
            if [ "$s" = healthy ]; then ok=1; break; fi
            sleep 2
          done
          if [ "$ok" = 1 ]; then curl -fsS http://127.0.0.1:52999/health || ok=0; fi
          if [ "$ok" != 1 ]; then docker logs fr; exit 1; fi
      - name: Dump container logs
        if: failure()
        run: docker logs fr || true

  publish:
    needs: image
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/setup-qemu-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/fakerock
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          flavor: latest=auto
      - name: Push (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
