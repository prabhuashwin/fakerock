name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[test]"
      - run: python -m unittest discover -s tests -v
      - run: python -m pytest examples -q

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - name: Install wheel in a fresh venv and smoke test
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install pytest boto3 dist/*.whl
          "$RUNNER_TEMP/venv/bin/fakerock" --version | grep -x "mock_bedrock 0.2.0"
          d=$(mktemp -d)
          cat > "$d/test_smoke.py" <<'EOF'
          def test_fakerock_fixture(fakerock):
              r = fakerock.client().converse(
                  modelId="anthropic.claude-test",
                  messages=[{"role": "user", "content": [{"text": "hi"}]}],
              )
              assert r["output"]["message"]["content"][0]["text"] == "Mock reply to: hi"
          EOF
          cd "$d" && "$RUNNER_TEMP/venv/bin/python" -m pytest -q
